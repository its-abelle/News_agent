[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deluxe-editorial"
version = "0.1.0"
description = "A checkpointed, source-led editorial assistant for Deluxe Studios"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2"]

[project.scripts]
deluxe = "deluxe.cli:main"
news-agent = "deluxe.cli:main"

[tool.setuptools.packages.find]
include = ["deluxe*"]

[tool.setuptools.package-data]
deluxe = ["*.json", "ui/*.html", "ui/*.css", "ui/*.js"]
